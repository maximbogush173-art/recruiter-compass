name: recruiter-compass

# Облачный контур «Компас рекрутера»: Postgres (изолированная база) + n8n + Caddy.
# Caddy отдаёт фронтенд и проксирует /webhook/* в n8n; editor — только 127.0.0.1:5678.
# Запуск из корня репозитория:
#   cp .env.example .env && (заполнить секреты)
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d

services:
  db:
    image: postgres:17-alpine
    container_name: compass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: ${COMPASS_DB_PASSWORD}
      POSTGRES_DB: compass
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass"]
      interval: 5s
      timeout: 5s
      retries: 12

  n8n:
    image: n8nio/n8n:2.37.10
    container_name: compass-n8n
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
      GENERIC_TIMEZONE: Europe/Moscow
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: "5678"
      N8N_ENCRYPTION_KEY: ${COMPASS_N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "14"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    container_name: compass-caddy
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist/client:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app

volumes:
  pgdata:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  app:
